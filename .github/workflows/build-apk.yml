name: Build Tauri Android APK & Windows Desktop

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies and Tauri CLI
        run: |
          npm install
          npm install -D @tauri-apps/cli@latest

      - name: Build Web Frontend with Build Metadata
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          GITHUB_SHA: ${{ github.sha }}
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure compatible Android NDK (v26/v27)
        run: |
          NDK_PATH=$(ls -d $ANDROID_HOME/ndk/27.* $ANDROID_HOME/ndk/26.* 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_PATH" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018"
            NDK_PATH="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV

      - name: Install Rust and Android ARM64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Initialize Tauri Rust & Android Architecture
        run: |
          if [ ! -d "src-tauri" ]; then
            npx tauri init --ci --app-name "Study Corner POS" --window-title "Study Corner POS" --frontend-dist "../dist/web" --dev-url "http://localhost:5173" --before-dev-command "" --before-build-command ""
            sed -i 's/"com.tauri.dev"/"com.studycorner.pos"/g' src-tauri/tauri.conf.json
          fi
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init --ci
          fi
          # Bump Android versionCode so in-place APK updates succeed
          if [ -f "src-tauri/gen/android/app/build.gradle.kts" ]; then
            sed -i "s/versionCode = [0-9]*/versionCode = ${{ github.run_number }}/g" src-tauri/gen/android/app/build.gradle.kts
          fi

      - name: Build & Sign Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p release-assets
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release-keystore.jks
            npx tauri android build --apk --target aarch64
            UNSIGNED_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*-unsigned.apk" -o -name "*.apk" | head -n 1)
            BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
            "$BUILD_TOOLS/apksigner" sign \
              --ks release-keystore.jks \
              --ks-pass "pass:$ANDROID_KEYSTORE_PASSWORD" \
              --ks-key-alias "$ANDROID_KEY_ALIAS" \
              --key-pass "pass:$ANDROID_KEY_PASSWORD" \
              --out release-assets/Study-Corner-POS.apk \
              "$UNSIGNED_APK"
          else
            npx tauri android build --apk --debug --target aarch64
            APK_FILE=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
            cp "$APK_FILE" release-assets/Study-Corner-POS.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Study-Corner-POS-APK
          path: release-assets/Study-Corner-POS.apk
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies and Tauri CLI
        run: |
          npm install
          npm install -D @tauri-apps/cli@latest

      - name: Build Web Frontend (if needed)
        shell: bash
        run: |
          if [ ! -d "dist/web" ]; then
            npm run build
          else
            echo "Using existing dist/web folder"
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Initialize Tauri Rust Architecture
        shell: bash
        run: |
          if [ ! -d "src-tauri" ]; then
            npx tauri init --ci --app-name "Study Corner POS" --window-title "Study Corner POS" --frontend-dist "../dist/web" --dev-url "http://localhost:5173" --before-dev-command "" --before-build-command ""
            sed -i 's/"com.tauri.dev"/"com.studycorner.pos"/g' src-tauri/tauri.conf.json
          fi

      - name: Build Windows Desktop Installer
        run: npx tauri build

      - name: Prepare Release Windows Installers
        shell: bash
        run: |
          mkdir -p release-assets
          EXE_FILE=$(find src-tauri/target/release/bundle/nsis -name "*.exe" | head -n 1)
          MSI_FILE=$(find src-tauri/target/release/bundle/msi -name "*.msi" | head -n 1)
          [ -n "$EXE_FILE" ] && cp "$EXE_FILE" release-assets/Study-Corner-POS-Setup.exe
          [ -n "$MSI_FILE" ] && cp "$MSI_FILE" release-assets/Study-Corner-POS.msi

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Study-Corner-POS-Windows
          path: release-assets/*
          if-no-files-found: error

  publish-release:
    needs: [ build-android, build-windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: Study-Corner-POS-APK
          path: release-assets

      - name: Download Windows Installers
        uses: actions/download-artifact@v4
        with:
          name: Study-Corner-POS-Windows
          path: release-assets

      - name: Generate version.json for In-App Updater
        run: |
          cat <<EOF > release-assets/version.json
          {
            "version": "1.0.0",
            "buildNumber": ${{ github.run_number }},
            "commit": "${GITHUB_SHA::7}",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "apkUrl": "https://github.com/angeladenicesuba-hue/Study-Corner/releases/download/latest/Study-Corner-POS.apk"
          }
          EOF

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Study Corner POS (Latest APK & Windows)
          body: Direct downloads for Android (APK) and Windows Desktop (EXE / MSI). For the full Counter PC SQLite + LAN Hub, run Start-StudyCorner-POS.bat.
          files: release-assets/*
          make_latest: true
