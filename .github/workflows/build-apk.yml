name: Build Tauri Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies and Tauri CLI
        run: |
          npm install
          npm install -D @tauri-apps/cli@latest

      - name: Build Web Frontend (if needed)
        run: |
          if [ ! -d "dist/web" ]; then
            npm run build
          else
            echo "Using existing dist/web folder"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure compatible Android NDK (v26/v27)
        run: |
          NDK_PATH=$(ls -d $ANDROID_HOME/ndk/27.* $ANDROID_HOME/ndk/26.* 2>/dev/null | sort -V | tail -n 1)
          if [ -z "$NDK_PATH" ]; then
            yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.2.12479018"
            NDK_PATH="$ANDROID_HOME/ndk/27.2.12479018"
          fi
          echo "ANDROID_NDK_ROOT=$NDK_PATH" >> $GITHUB_ENV
          echo "NDK_HOME=$NDK_PATH" >> $GITHUB_ENV

      - name: Install Rust and Android ARM64 target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Initialize Tauri Rust & Android Architecture
        run: |
          if [ ! -d "src-tauri" ]; then
            npx tauri init --ci --app-name "Study Corner POS" --window-title "Study Corner POS" --frontend-dist "../dist/web" --dev-url "http://localhost:5173" --before-dev-command "" --before-build-command ""
            sed -i 's/"com.tauri.dev"/"com.studycorner.pos"/g' src-tauri/tauri.conf.json
          fi
          if [ ! -d "src-tauri/gen/android" ]; then
            npx tauri android init --ci
          fi

      - name: Build Debug APK
        run: npx tauri android build --apk --debug --target aarch64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Study-Corner-POS-APK
          path: src-tauri/gen/android/app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error

      - name: Prepare Release APK
        run: |
          APK_FILE=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          cp "$APK_FILE" Study-Corner-POS.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Study Corner POS (Latest APK)
          body: Direct Android APK download for Study Corner POS.
          files: Study-Corner-POS.apk
          make_latest: true

